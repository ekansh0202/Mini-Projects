<html>
  <head>
    <title>CAROUSEL</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <span class="left button">⬅️</span>
        <image src="" class="image" alt="Image" />
        <span class="right button">➡️</span>
      </div>
      <div class="pages">
        <div class="page one"></div>
        <div class="page two"></div>
        <div class="page three"></div>
        <div class="page four"></div>
      </div>
      <div class="scroll control">
        <label class="scroll-label">Infinite Scroll</label>
        <input type="checkbox" class="scroll-check" />
      </div>
      <div class="autplay control">
        <label class="autoplay-label">Autoplay</label>
        <input type="checkbox" class="autplay-check" />
      </div>
      <div class="interval control">
        <label class="autoplay-interval">Autoplay Interval</label>
        <input type="range" class="autplay-interval" min="0" max="5" value="2"/>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
