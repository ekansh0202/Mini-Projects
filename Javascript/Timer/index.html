<html>
    <head>
        <title>Timer</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div class="container">
            <div class="time">
                <span class="label hour-one">0</span>
                <span class="label hour-ten">2</span>
                <span class="label">:</span>
                <span class="label second-one">0</span>
                <span class="label second-ten">5</span>
            </div>
            <div class="buttons">
                <button class="button start">Start</button>
                <button class="button stop">Stop</button>
                <button class="button reset">Reset</button>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
