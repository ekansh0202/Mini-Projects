<html>
    <head>
        <title>GUESS THE NUMBERS</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div class="container">
            <span class="label">Enter a guess between 0 to 100</span>
            <input class="input-value" type="number" placeholder="Enter a number" />
            <div class="buttons">
                <button class="button submit">Submit</button>
                <button class="button start" disabled>Start Game</button>
            </div>
            <div class="result"></div>
            <div class="answers"></div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
